<!-- ============================================================================
     РУМ-СЕРВИС «БЕРЁЗА» / отель «КАМЕРТОН» — модификация корзины Tilda (t706)
     ----------------------------------------------------------------------------
     Что делает:
       1. Завтраки  — слоты 08:00 / 08:30 / 09:00 / 09:30 / 10:00, кухне 30 мин.
       2. Остальное — слоты 13:00 … 22:00 (каждый час),        кухне 60 мин.
          Слот доступен, если ДО него осталось не меньше времени на готовку.
          (в 7:31 МСК слот 8:00 уже закрыт, доступны 8:30 и далее)
       3. Пересчёт доступности — в реальном времени, каждую секунду.
       4. Завтраки нельзя смешивать с другими категориями: ошибка показывается
          в момент добавления товара, оформление заказа блокируется.
       5. Время — московское, синхронизируется с временем сервера
          (часы гостя могут быть сбиты — это не сломает логику).
       6. Выбранные дата и время записываются в штатные поля Tilda
          data_dostavki (ДД-ММ-ГГГГ) и vremya_dostavki (ЧЧ:ММ) —
          заказ уходит в CRM/почту в прежнем формате.

     Куда вставлять:
       Настройки сайта → Ещё → HTML-код для вставки внутрь BODY (перед </body>)
       ИЛИ блок T123 «HTML» в футере. Публикация всех страниц.

     Настройка (блок CFG ниже):
       CFG.menus.*.slots / .lead  — слоты и время на приготовление (в минутах)
       CFG.breakfast.*            — как система узнаёт завтраки (id / slug / названия)
       CFG.daysForward            — на сколько дней вперёд можно заказать (1 = сегодня и завтра)
     ========================================================================= -->

<script>
(function () {
  'use strict';
  if (window.__RSB_CART__) { return; }
  window.__RSB_CART__ = true;

  /* ======================== НАСТРОЙКИ ======================== */
  var CFG = {
    tz: 'Europe/Moscow',
    daysForward: 1,            /* 1 = «Сегодня» + «Завтра»; 2 = ещё и «Послезавтра» */
    menus: {
      breakfast: {
        key: 'breakfast',
        name: 'Завтраки',
        slots: ['08:00', '08:30', '09:00', '09:30', '10:00'],
        lead: 30,              /* минут на приготовление */
        note: 'Завтраки подаём с 8:00 до 10:00. Кухне нужно 30 минут на приготовление, поэтому ближайшие слоты закрываются заранее.'
      },
      main: {
        key: 'main',
        name: 'Основное меню',
        slots: ['13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'],
        lead: 60,
        note: 'Блюда основного меню подаём с 13:00 до 22:00. Кухне нужен 1 час на приготовление, поэтому ближайший слот закрывается заранее.'
      }
    },
    /* Как система определяет завтрак. Достаточно совпадения по любому пункту.
       При добавлении нового завтрака в каталог — допишите его сюда
       (id из ссылки /tproduct/XXXXXXXXXXXX-... или точное название). */
    breakfast: {
      ids: ['142718970583','296082006963','847153183813','523668981613',
            '893065655203','781713795803','351217116933','378144183863','315374361683'],
      slugs: ['sitnii-set-russkii-zavtrak','klassicheskii-set-angliiskii-zavtrak',
              'iziskannii-set-skandinavskii-zavtrak','shakshuka','sendvich-s-vetchinoi-i-sirom',
              'sendvich-so-slabosolyonim-lososem','ovsyanaya-kasha-s-yablokami-i-myodom-bez',
              'nezhnaya-tvorozhnaya-zapekanka-s-topping','vozdushnie-domashnie-sirniki-s-toppingom'],
      titles: ['Сытный сет «Русский завтрак»','Классический сет «Английский завтрак»',
               'Изысканный сет «Скандинавский завтрак»','Шакшука','Сэндвич с ветчиной и сыром',
               'Сэндвич со слабосолёным лососем','Овсяная каша с яблоками и мёдом (без сахара)',
               'Нежная творожная запеканка с топпингом на выбор','Воздушные домашние сырники с топпингом на выбор'],
      /* страховка на будущее: всё, где в названии или ссылке есть «завтрак/zavtrak» */
      keywords: ['завтрак', 'zavtrak']
    },
    fields: { date: 'data_dostavki', time: 'vremya_dostavki' },
    hideNativeFields: true,    /* спрятать штатные поля «дата» и «время» (значения заполняем сами) */
    syncServerTime: true,      /* сверять часы гостя с часами сервера */
    debug: false
  };
  /* ====================== /НАСТРОЙКИ ========================= */

  var MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var DOW = ['вс','пн','вт','ср','чт','пт','сб'];
  var DAY_NAMES = ['Сегодня', 'Завтра', 'Послезавтра'];

  function log() { if (CFG.debug && window.console) { console.log.apply(console, ['[rsb]'].concat([].slice.call(arguments))); } }

  /* ---------------------- Время (МСК) ---------------------- */
  var skew = 0; /* поправка часов гостя к серверному времени, мс */
  function now() { return Date.now() + skew; }

  var DTF = null;
  try {
    DTF = new Intl.DateTimeFormat('en-GB', {
      timeZone: CFG.tz, hour12: false, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    DTF.formatToParts(new Date());
  } catch (e) { DTF = null; }

  function mskParts(ts) {
    if (DTF) {
      var o = {}, arr = DTF.formatToParts(new Date(ts)), i;
      for (i = 0; i < arr.length; i++) { if (arr[i].type !== 'literal') { o[arr[i].type] = arr[i].value; } }
      return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second };
    }
    var dt = new Date(ts + 180 * 60000); /* фолбэк: МСК = UTC+3 */
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(),
             h: dt.getUTCHours(), mi: dt.getUTCMinutes(), s: dt.getUTCSeconds() };
  }
  function mskOffsetMin(ts) {
    var p = mskParts(ts);
    return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(ts / 1000) * 1000) / 60000);
  }
  /* «стенные» МСК-дата и время -> абсолютная метка времени */
  function mskEpoch(y, m, d, h, mi) {
    var base = Date.UTC(y, m - 1, d, h, mi);
    var off = mskOffsetMin(base - 180 * 60000);
    return base - off * 60000;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hhmm(ts) { var p = mskParts(ts); return pad(p.h) + ':' + pad(p.mi); }

  /* День со сдвигом от «сегодня» по МСК */
  function dayInfo(offset) {
    var b = mskParts(now());
    var dt = new Date(Date.UTC(b.y, b.m - 1, b.d) + offset * 86400000);
    var y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
    return {
      offset: offset, y: y, m: m, d: d,
      key: y + '-' + pad(m) + '-' + pad(d),
      value: pad(d) + '-' + pad(m) + '-' + y,                       /* формат поля Tilda */
      title: DAY_NAMES[offset] || (DOW[dt.getUTCDay()] + ', ' + d + ' ' + MON[m - 1]),
      sub: d + ' ' + MON[m - 1] + (DAY_NAMES[offset] ? '' : '')
    };
  }

  /* Синхронизация с часами сервера: часы гостя часто сбиты */
  var lastSync = 0;
  function syncTime() {
    if (!CFG.syncServerTime || !window.fetch || now() - lastSync < 240000) { return; }
    lastSync = now();
    var t0 = Date.now();
    try {
      fetch(location.pathname + '?rsb=' + t0, { method: 'HEAD', cache: 'no-store', credentials: 'omit' })
        .then(function (r) {
          var h = r && r.headers && r.headers.get('Date');
          if (!h) { return; }
          var srv = Date.parse(h);
          if (!srv) { return; }
          var rtt = Date.now() - t0;
          if (rtt > 8000) { return; }
          var delta = srv + rtt / 2 - Date.now();
          /* поправку применяем только если расхождение существенное (> 30 c) */
          skew = Math.abs(delta) > 30000 ? delta : 0;
          log('server skew', Math.round(skew / 1000), 'c');
          schedule();
        })['catch'](function () {});
    } catch (e) {}
  }

  /* ------------------- Определение категории ------------------- */
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/ё/g, 'е').replace(/[«»"'’`]/g, '').replace(/\s+/g, ' ').trim();
  }
  var BT = [];
  (function () { for (var i = 0; i < CFG.breakfast.titles.length; i++) { BT.push(norm(CFG.breakfast.titles[i])); } })();

  function isBreakfast(p) {
    if (!p) { return false; }
    var url = String(p.url || ''), uid = String(p.uid || ''), name = norm(p.name), i;
    for (i = 0; i < CFG.breakfast.ids.length; i++) {
      if (url.indexOf(CFG.breakfast.ids[i]) !== -1 || uid === CFG.breakfast.ids[i]) { return true; }
    }
    for (i = 0; i < CFG.breakfast.slugs.length; i++) { if (url.indexOf(CFG.breakfast.slugs[i]) !== -1) { return true; } }
    for (i = 0; i < BT.length; i++) { if (BT[i] && name.indexOf(BT[i]) === 0) { return true; } }
    var hay = name + ' ' + url.toLowerCase();
    for (i = 0; i < CFG.breakfast.keywords.length; i++) {
      if (hay.indexOf(norm(CFG.breakfast.keywords[i])) !== -1) { return true; }
    }
    return false;
  }

  /* ------------------------- Корзина -------------------------- */
  /* Позиция считается настоящей, только если у неё есть чем себя опознать и количество > 0.
     Tilda иногда оставляет в tcart.products «фантомы» — записи с нулевым количеством или
     без названия. Гость их не видит, а корзина при этом выглядит непустой. */
  function validProduct(p) {
    if (!p || typeof p !== 'object') { return false; }
    var q = (p.quantity === undefined || p.quantity === null || p.quantity === '') ? 1 : parseFloat(p.quantity);
    if (!(q > 0)) { return false; }
    return !!(p.name || p.url || p.uid);
  }
  /* Сколько позиций показывает сама Tilda: 0 — корзина пуста, -1 — счётчик не найден */
  function tildaCartCount() {
    if (!window.tcart) { return -1; }
    var els = document.querySelectorAll('.t706__carticon-counter, .js-carticon-counter, .t-menuwidgeticons__icon-counter');
    if (!els.length) { return -1; }
    var max = -1, i, txt;
    for (i = 0; i < els.length; i++) {
      txt = (els[i].textContent || '').replace(/[^0-9]/g, '');
      max = Math.max(max, txt === '' ? 0 : (parseInt(txt, 10) || 0));
    }
    return max;
  }
  function cartProducts() {
    var t = window.tcart, list = null;
    if (t && Object.prototype.toString.call(t.products) === '[object Array]') {
      list = t.products;                       /* живой объект Tilda — единственный источник правды */
    } else if (!t) {
      try {                                    /* корзина ещё не инициализирована — читаем хранилище */
        var l = JSON.parse(localStorage.getItem('tcart') || 'null');
        if (l && Object.prototype.toString.call(l.products) === '[object Array]') { list = l.products; }
      } catch (e) { list = null; }
    }
    if (!list || !list.length) { return []; }
    var out = [], i;
    for (i = 0; i < list.length; i++) { if (validProduct(list[i])) { out.push(list[i]); } }
    return out;
  }
  function analyze() {
    var ps = cartProducts(), b = 0, m = 0, i;
    for (i = 0; i < ps.length; i++) {
      if (isBreakfast(ps[i])) { b += 1; } else { m += 1; }
    }
    return {
      count: ps.length, nb: b, nm: m,
      conflict: b > 0 && m > 0,
      menu: (b > 0 && m === 0) ? 'breakfast' : ((m > 0 && b === 0) ? 'main' : null)
    };
  }
  function cartSign() {
    var ps = cartProducts(), s = '', i;
    for (i = 0; i < ps.length; i++) { s += (ps[i].uid || ps[i].name || '') + 'x' + (ps[i].quantity || 1) + '|'; }
    return s;
  }
  function deleteAt(i) {
    try {
      if (typeof window.tcart__deleteProduct === 'function') { window.tcart__deleteProduct(i); return true; }
    } catch (e) {}
    try {
      if (window.tcart && window.tcart.products) {
        window.tcart.products.splice(i, 1);
        if (typeof window.tcart__updateTotalProductsinCartObj === 'function') { window.tcart__updateTotalProductsinCartObj(); }
        if (typeof window.tcart__saveLocalObj === 'function') { window.tcart__saveLocalObj(); }
        if (typeof window.tcart__reDrawProducts === 'function') { window.tcart__reDrawProducts(); }
        if (typeof window.tcart__reDrawCartIcon === 'function') { window.tcart__reDrawCartIcon(); }
        return true;
      }
    } catch (e2) {}
    var rows = document.querySelectorAll('.t706__cartwin-products .t706__product');
    if (rows[i]) {
      var del = rows[i].querySelector('.t706__product-del, .t706__product-delcircle');
      if (del) { del.click(); return true; }
    }
    return false;
  }
  /* Полная очистка — выход из любого тупикового состояния корзины */
  function clearCart(done, guard) {
    guard = (guard || 0) + 1;
    var raw = (window.tcart && window.tcart.products) ? window.tcart.products : [];
    if (!raw.length || guard > 60 || !deleteAt(0)) {
      schedule();
      if (done) { done(); }
      return;
    }
    setTimeout(function () { clearCart(done, guard); }, 80);
  }

  /* Удаляем по одному: Tilda перерисовывает список после каждой операции */
  function removeWhere(pred) {
    var ps = cartProducts(), i, idx = -1;
    for (i = 0; i < ps.length; i++) { if (pred(ps[i])) { idx = i; break; } }
    if (idx === -1) { schedule(); return; }
    if (!deleteAt(idx)) { schedule(); return; }
    setTimeout(function () { removeWhere(pred); }, 90);
  }

  /* ------------------------ Уведомления ----------------------- */
  var toastBox = null, lastToast = { key: '', at: 0 };
  var ICO_ERR = '<svg class="rsb-toast__i" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M10 5.5v5.2M10 14.2v.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  function toast(title, descr, type, key, action) {
    var k = key || title;
    if (k === lastToast.key && Date.now() - lastToast.at < 2500) { return; }
    lastToast = { key: k, at: Date.now() };
    if (!toastBox) {
      toastBox = document.createElement('div');
      toastBox.className = 'rsb-toasts';
      toastBox.setAttribute('role', 'region');
      toastBox.setAttribute('aria-live', 'assertive');
      document.body.appendChild(toastBox);
    }
    var t = document.createElement('div');
    t.className = 'rsb-toast' + (type === 'err' ? ' rsb-toast_err' : '');
    t.setAttribute('role', 'alert');
    t.innerHTML = ICO_ERR +
      '<div class="rsb-toast__c"><div class="rsb-toast__t"></div>' +
      (descr ? '<div class="rsb-toast__d"></div>' : '') + '</div>' +
      '<button type="button" class="rsb-toast__x" aria-label="Закрыть">' +
      '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
    t.querySelector('.rsb-toast__t').textContent = title;
    if (descr) { t.querySelector('.rsb-toast__d').textContent = descr; }
    var close = function () {
      if (!t.parentNode) { return; }
      t.className += ' rsb-out';
      setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 240);
    };
    t.querySelector('.rsb-toast__x').addEventListener('click', close);
    if (action) {
      var ab = document.createElement('button');
      ab.type = 'button';
      ab.className = 'rsb-toast__b';
      ab.textContent = action.label;
      ab.addEventListener('click', function () { close(); action.run(); });
      t.querySelector('.rsb-toast__c').appendChild(ab);
    }
    toastBox.appendChild(t);
    setTimeout(close, action ? 12000 : 6000);
    try { if (navigator.vibrate && type === 'err') { navigator.vibrate([16, 40, 16]); } } catch (e) {}
  }

  /* ------------------------- Панель --------------------------- */
  var ICO_OK   = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7.2" stroke="currentColor" stroke-width="1.4"/><path d="M4.8 8.2l2.1 2.1 4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICO_INFO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4M8 4.6v.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

  var panels = [];   /* по одной панели на каждый блок корзины */
  var sel = { day: null, time: null };
  var prevConflict = false;
  var lastBuild = '';

  function plural(n, a, b, c) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) { return a; }
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) { return b; }
    return c;
  }

  function buildPanel(form) {
    var p = document.createElement('div');
    p.className = 'rsb-slots';
    p.innerHTML =
      '<div class="rsb-err" role="alert">' +
        '<div class="rsb-err__t">' + ICO_ERR.replace('rsb-toast__i', '') + '<span>Завтраки нельзя заказать вместе с основным меню</span></div>' +
        '<div class="rsb-err__d"></div>' +
        '<div class="rsb-err__a">' +
          '<button type="button" class="rsb-btn" data-rsb="keep-b">Оставить только завтраки</button>' +
          '<button type="button" class="rsb-btn rsb-btn_gh" data-rsb="keep-m">Оставить основное меню</button>' +
        '</div>' +
      '</div>' +
      '<div class="rsb-body">' +
        '<div class="rsb-slots__head">' +
          '<div class="rsb-slots__title">Время подачи в номер</div>' +
          '<div class="rsb-clock"><i></i>Москва&nbsp;<b>--:--</b></div>' +
        '</div>' +
        '<div class="rsb-note"></div>' +
        '<div class="rsb-label">Дата</div>' +
        '<div class="rsb-row rsb-days"></div>' +
        '<div class="rsb-label">Время</div>' +
        '<div class="rsb-row rsb-times"></div>' +
        '<div class="rsb-status"></div>' +
      '</div>';
    var o = {
      root: p, form: form,
      err: p.querySelector('.rsb-err'),
      errd: p.querySelector('.rsb-err__d'),
      body: p.querySelector('.rsb-body'),
      clock: p.querySelector('.rsb-clock b'),
      note: p.querySelector('.rsb-note'),
      days: p.querySelector('.rsb-days'),
      times: p.querySelector('.rsb-times'),
      status: p.querySelector('.rsb-status'),
      dayEls: [], timeEls: []
    };
    p.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-rsb]') : null;
      if (!b) { return; }
      e.preventDefault();
      var a = b.getAttribute('data-rsb');
      if (a === 'keep-b') { removeWhere(function (x) { return !isBreakfast(x); }); }
      else if (a === 'keep-m') { removeWhere(function (x) { return isBreakfast(x); }); }
      else if (a === 'day') { sel.day = b.getAttribute('data-key'); sel.time = null; render(true); }
      else if (a === 'time') { sel.time = b.getAttribute('data-time'); render(true); }
    });
    return o;
  }

  function mountPanels() {
    var forms = document.querySelectorAll('.t706 .t706__orderform'), i, host, o;
    for (i = 0; i < forms.length; i++) {
      host = forms[i];
      o = host.__rsbPanel;
      if (!o) {
        o = buildPanel(host.querySelector('form') || host);
        host.__rsbPanel = o;
        panels.push(o);
      }
      if (o.root.parentNode !== host.parentNode) {
        host.parentNode.insertBefore(o.root, host);
        prepareNativeFields(o);
      }
    }
  }

  function nativeInput(o, name) {
    var f = o.form || document;
    return f.querySelector('input[name="' + name + '"]') ||
           document.querySelector('.t706 input[name="' + name + '"]');
  }
  function prepareNativeFields(o) {
    var d = nativeInput(o, CFG.fields.date), t = nativeInput(o, CFG.fields.time), g;
    if (d) {
      /* дату ставим мы, поэтому снимаем проверку «дата в прошлом»
         (часовой пояс устройства гостя может отличаться от московского) */
      d.removeAttribute('data-tilda-dateunvailable');
      d.setAttribute('readonly', 'readonly');
      if (CFG.hideNativeFields) { g = d.closest ? d.closest('.t-input-group') : null; if (g) { g.className += ' rsb-hidden-native'; } }
    }
    if (t) {
      t.setAttribute('readonly', 'readonly');
      if (CFG.hideNativeFields) { g = t.closest ? t.closest('.t-input-group') : null; if (g) { g.className += ' rsb-hidden-native'; } }
    }
  }
  function setNative(o, dateVal, timeVal) {
    var d = nativeInput(o, CFG.fields.date), t = nativeInput(o, CFG.fields.time);
    [[d, dateVal], [t, timeVal]].forEach(function (pair) {
      var el = pair[0], v = pair[1] == null ? '' : pair[1];
      if (!el || el.value === v) { return; }
      el.value = v;
      try {
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      } catch (e) {
        var ev = document.createEvent('HTMLEvents'); ev.initEvent('change', true, false); el.dispatchEvent(ev);
      }
      var grp = el.closest ? el.closest('.t-input-group') : null;
      if (v && grp) {
        grp.className = grp.className.replace(/\s*js-error-control-box\s*/g, ' ');
        el.className = el.className.replace(/\s*t-input_has-error\s*/g, ' ');
      }
    });
  }

  /* Слоты выбранного меню на конкретный день */
  function slotsFor(menuKey, day) {
    var menu = CFG.menus[menuKey], n = now(), out = [], i, hm, ts, dl;
    for (i = 0; i < menu.slots.length; i++) {
      hm = menu.slots[i].split(':');
      ts = mskEpoch(day.y, day.m, day.d, +hm[0], +hm[1]);
      dl = ts - menu.lead * 60000;
      out.push({ time: menu.slots[i], ts: ts, deadline: dl, ok: n <= dl });
    }
    return out;
  }
  function days() {
    var a = [], i;
    for (i = 0; i <= CFG.daysForward; i++) { a.push(dayInfo(i)); }
    return a;
  }

  function setStatus(o, cls, icon, html) {
    o.status.className = 'rsb-status' + (cls ? ' ' + cls : '');
    o.status.innerHTML = icon + '<div>' + html + '</div>';
  }

  var raf = null;
  function schedule() {
    if (raf) { return; }
    raf = (window.requestAnimationFrame || function (f) { return setTimeout(f, 16); })(function () {
      raf = null; render(false);
    });
  }

  function render(userAction) {
    mountPanels();
    var st = analyze();

    /* мгновенная ошибка при смешивании категорий */
    if (st.conflict && !prevConflict) {
      toast('Завтраки нельзя смешивать с основным меню',
            'У них разное время подачи. Оформите два отдельных заказа.', 'err', 'mix');
    }
    prevConflict = st.conflict;

    var i;
    for (i = 0; i < panels.length; i++) { renderPanel(panels[i], st, userAction); }
    updateSubmitState(st);
  }

  function renderPanel(o, st, userAction) {
    var on = st.count > 0;
    setCls(o.root, 'rsb-on', on);
    if (!on) { setNative(o, '', ''); return; }

    /* --- конфликт категорий --- */
    if (st.conflict) {
      o.err.className = 'rsb-err rsb-on';
      o.body.style.display = 'none';
      o.errd.textContent =
        'В корзине ' + st.nb + ' ' + plural(st.nb, 'завтрак', 'завтрака', 'завтраков') +
        ' и ' + st.nm + ' ' + plural(st.nm, 'блюдо', 'блюда', 'блюд') + ' основного меню. ' +
        'Завтраки готовятся с 8:00 до 10:00, остальные блюда — с 13:00 до 22:00, ' +
        'поэтому их нельзя объединить в один заказ.';
      setNative(o, '', '');
      return;
    }
    o.err.className = 'rsb-err';
    o.body.style.display = '';

    var menuKey = st.menu || 'main';
    var menu = CFG.menus[menuKey];
    var dl = days();
    var sign = menuKey + '|' + dl[0].key + '|' + dl.length;

    /* --- пересборка чипов (меню или календарная дата сменились) --- */
    if (o.sign !== sign) {
      o.sign = sign;
      o.note.textContent = menu.note;
      o.days.innerHTML = ''; o.dayEls = [];
      for (var i = 0; i < dl.length; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'rsb-chip';
        b.setAttribute('data-rsb', 'day'); b.setAttribute('data-key', dl[i].key);
        b.innerHTML = '<span>' + dl[i].title + '</span><span class="rsb-chip__sub">' + dl[i].sub + '</span>';
        b.__day = dl[i];
        o.days.appendChild(b); o.dayEls.push(b);
      }
      o.times.innerHTML = ''; o.timeEls = [];
      for (var j = 0; j < menu.slots.length; j++) {
        var t = document.createElement('button');
        t.type = 'button'; t.className = 'rsb-chip';
        t.setAttribute('data-rsb', 'time'); t.setAttribute('data-time', menu.slots[j]);
        t.textContent = menu.slots[j];
        o.times.appendChild(t); o.timeEls.push(t);
      }
      if (sel.day && !findDay(dl, sel.day)) { sel.day = null; sel.time = null; }
    }

    /* --- день по умолчанию: первый, где ещё есть свободные слоты.
           Если на выбранной дате приём закрылся, пока гость выбирал, — переключаем сами --- */
    var cd = findDay(dl, sel.day);
    if (!cd || !hasFree(slotsFor(menuKey, cd))) {
      var was = sel.day;
      sel.day = dl[0].key;
      for (var d1 = 0; d1 < dl.length; d1++) {
        if (hasFree(slotsFor(menuKey, dl[d1]))) { sel.day = dl[d1].key; break; }
      }
      if (was && was !== sel.day) {
        var nd = findDay(dl, sel.day);
        toast('Приём заказов на эту дату закрыт',
              'Перенесли выбор на «' + (nd ? nd.title.toLowerCase() : 'другую дату') + '».', 'err', 'dayshift' + sel.day);
      }
    }
    var day = findDay(dl, sel.day) || dl[0];
    var slots = slotsFor(menuKey, day);

    /* --- часы --- */
    var nowTxt = hhmm(now());
    if (o.clock.textContent !== nowTxt) { o.clock.textContent = nowTxt; }

    /* --- дни: доступность и выбор --- */
    for (var k = 0; k < o.dayEls.length; k++) {
      var de = o.dayEls[k], free = hasFree(slotsFor(menuKey, de.__day));
      de.disabled = !free;
      setCls(de, 'rsb-sel', de.__day.key === day.key);
      de.title = free ? '' : 'На эту дату приём заказов уже закрыт';
    }

    /* --- слоты: доступность, выбор, подсказки --- */
    var selValid = false, firstFree = -1;
    for (var s = 0; s < slots.length; s++) {
      var el = o.timeEls[s], it = slots[s];
      el.disabled = !it.ok;
      if (it.ok && firstFree === -1) { firstFree = s; }
      var isSel = (sel.time === it.time);
      if (isSel && it.ok) { selValid = true; }
      setCls(el, 'rsb-sel', isSel && it.ok);
      el.title = it.ok
        ? ('Оформите заказ до ' + hhmm(it.deadline) + ' — кухне нужно ' + menu.lead + ' мин')
        : ('Уже недоступно: кухне нужно ' + menu.lead + ' мин на приготовление');
    }
    /* выбранный слот «сгорел», пока гость думал */
    if (sel.time && !selValid) {
      var expired = sel.time;
      sel.time = null;
      if (o.__lastExpired !== day.key + expired) {
        o.__lastExpired = day.key + expired;
        toast('Время ' + expired + ' больше недоступно',
              'Кухне нужно ' + menu.lead + ' минут на приготовление. Выберите другое время.', 'err', 'exp' + expired);
        shake(o.times);
      }
    }
    for (var q = 0; q < o.timeEls.length; q++) { setCls(o.timeEls[q], 'rsb-hint', q === firstFree && !sel.time); }

    /* --- статус --- */
    if (firstFree === -1) {
      setStatus(o, 'rsb-bad', ICO_ERR.replace('rsb-toast__i', ''),
        'На <b>' + day.title.toLowerCase() + '</b> приём заказов уже закрыт. Выберите другую дату.');
      setNative(o, '', '');
    } else if (!sel.time) {
      setStatus(o, '', ICO_INFO,
        'Выберите время подачи — доступно с <b>' + slots[firstFree].time + '</b>. ' +
        'Заказ принимаем не позднее чем за ' + menu.lead + ' мин до подачи.');
      setNative(o, '', '');
    } else {
      var cur = null;
      for (var z = 0; z < slots.length; z++) { if (slots[z].time === sel.time) { cur = slots[z]; } }
      var left = cur ? cur.deadline - now() : 0;
      var txt = 'Подадим в номер <b>' + day.title.toLowerCase() + ' в ' + sel.time + '</b> по московскому времени.';
      if (left < 15 * 60000) {
        var mins = Math.max(0, Math.floor(left / 60000));
        setStatus(o, 'rsb-warn', ICO_INFO, txt + ' Оформите заказ до <b>' + hhmm(cur.deadline) + '</b> — ' +
          (mins > 0 ? ('осталось ' + mins + ' ' + plural(mins, 'минута', 'минуты', 'минут')) : 'меньше минуты') + '.');
      } else {
        setStatus(o, 'rsb-ok', ICO_OK, txt);
      }
      setNative(o, day.value, sel.time);
    }
    if (userAction && sel.time) { o.__lastExpired = null; }
  }

  function findDay(list, key) { for (var i = 0; i < list.length; i++) { if (list[i].key === key) { return list[i]; } } return null; }
  function hasFree(slots) { for (var i = 0; i < slots.length; i++) { if (slots[i].ok) { return true; } } return false; }
  function setCls(el, cls, on) {
    var has = (' ' + el.className + ' ').indexOf(' ' + cls + ' ') !== -1;
    if (on && !has) { el.className += ' ' + cls; }
    else if (!on && has) { el.className = (' ' + el.className + ' ').replace(' ' + cls + ' ', ' ').trim(); }
  }
  function shake(el) {
    if (!el) { return; }
    setCls(el, 'rsb-shake', false);
    void el.offsetWidth;
    setCls(el, 'rsb-shake', true);
    setTimeout(function () { setCls(el, 'rsb-shake', false); }, 500);
  }

  /* --------------------- Блокировка отправки -------------------- */
  function validate() {
    var st = analyze();
    if (st.count === 0 || panels.length === 0) { return { ok: true }; }
    if (st.conflict) { return { ok: false, why: 'mix' }; }
    var menuKey = st.menu || 'main';
    var dl = days(), day = findDay(dl, sel.day) || dl[0];
    if (!sel.time) { return { ok: false, why: 'notime' }; }
    var slots = slotsFor(menuKey, day), i;
    for (i = 0; i < slots.length; i++) {
      if (slots[i].time === sel.time) {
        if (!slots[i].ok) { return { ok: false, why: 'expired', time: sel.time, lead: CFG.menus[menuKey].lead }; }
        setNativeAll(day.value, sel.time);
        return { ok: true };
      }
    }
    return { ok: false, why: 'notime' };
  }
  function setNativeAll(d, t) { for (var i = 0; i < panels.length; i++) { setNative(panels[i], d, t); } }

  function updateSubmitState(st) {
    var v = (st.count === 0) ? { ok: true } : validate();
    var btns = document.querySelectorAll('.t706 .t-submit'), i;
    for (i = 0; i < btns.length; i++) { setCls(btns[i], 'rsb-blocked', !v.ok && st.count > 0); }
  }

  function reportProblem(v) {
    var p = panels[0], i;
    for (i = 0; i < panels.length; i++) { if (panels[i].root.offsetParent !== null) { p = panels[i]; break; } }
    if (v.why === 'mix') {
      toast('Завтраки нельзя смешивать с основным меню',
            'Уберите лишние позиции — кнопки для этого есть в корзине.', 'err', 'mix-submit');
      if (p) { shake(p.err); }
    } else if (v.why === 'expired') {
      toast('Время ' + v.time + ' больше недоступно',
            'Кухне нужно ' + v.lead + ' минут на приготовление. Выберите другое время.', 'err', 'exp-submit');
      if (p) { shake(p.times); }
    } else {
      toast('Выберите время подачи', 'Укажите, когда принести заказ в номер.', 'err', 'notime');
      if (p) { shake(p.times); }
    }
    if (p && p.root.scrollIntoView) {
      try { p.root.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      catch (e) { p.root.scrollIntoView(); }
    }
    render(true);
  }

  function inCart(el) { return !!(el && el.closest && el.closest('.t706')); }

  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.t-submit, button[type="submit"]') : null;
    if (!b || !inCart(b)) { return; }
    var v = validate();
    if (!v.ok) { e.preventDefault(); e.stopPropagation(); reportProblem(v); }
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.keyCode !== 13 && e.key !== 'Enter') { return; }
    if (!inCart(e.target)) { return; }
    if (e.target && e.target.tagName === 'TEXTAREA') { return; }
    var v = validate();
    if (!v.ok) { e.preventDefault(); e.stopPropagation(); reportProblem(v); }
  }, true);

  document.addEventListener('submit', function (e) {
    if (!inCart(e.target)) { return; }
    var v = validate();
    if (!v.ok) { e.preventDefault(); e.stopImmediatePropagation(); reportProblem(v); }
  }, true);

  /* --------- Запрет добавления «несовместимого» товара --------- */
  function wrapAdd() {
    var f = window.tcart__addProduct;
    if (typeof f !== 'function' || f.__rsb) { return; }
    var wrapped = function (product) {
      var args = arguments, self = this;
      try {
        var st = analyze();
        var kind = isBreakfast(product) ? 'breakfast' : 'main';
        /* Блокируем, только если корзина точно не пуста: если сама Tilda показывает 0 позиций,
           верим ей и пропускаем товар — конфликт всё равно поймает баннер в корзине.
           Гость никогда не должен упереться в ошибку при пустой корзине. */
        if (st.menu && st.menu !== kind && st.count > 0 && tildaCartCount() !== 0) {
          var esc = { label: 'Очистить корзину и добавить', run: function () {
            clearCart(function () { f.apply(self, args); schedule(); });
          } };
          if (kind === 'breakfast') {
            toast('Завтрак нельзя добавить к этому заказу',
                  'Завтраки подаются с 8:00 до 10:00 и оформляются отдельным заказом.', 'err', 'mix-add', esc);
          } else {
            toast('Это блюдо нельзя добавить к завтракам',
                  'Основное меню подаётся с 13:00 до 22:00 и оформляется отдельным заказом.', 'err', 'mix-add', esc);
          }
          schedule();
          return false;
        }
      } catch (err) { log('addProduct hook error', err); }
      return f.apply(self, args);
    };
    wrapped.__rsb = true; wrapped.__orig = f;
    window.tcart__addProduct = wrapped;
    log('tcart__addProduct wrapped');
  }
  function wrapSave() {
    var f = window.tcart__saveLocalObj;
    if (typeof f !== 'function' || f.__rsb) { return; }
    var wrapped = function () { var r = f.apply(this, arguments); schedule(); return r; };
    wrapped.__rsb = true; wrapped.__orig = f;
    window.tcart__saveLocalObj = wrapped;
  }

  /* ---------------------------- Старт --------------------------- */
  function boot() {
    var recs = document.querySelector('.t-records');
    var mode = recs ? recs.getAttribute('data-tilda-mode') : '';
    if (mode === 'edit' || mode === 'preview') { return; }   /* не мешаем редактору Tilda */

    syncTime();
    wrapAdd(); wrapSave();
    mountPanels();
    render(false);

    /* реакция на любые изменения корзины */
    var lastSign = cartSign();
    setInterval(function () {
      wrapAdd(); wrapSave();                     /* если Tilda переопределила функции */
      var s = cartSign();
      if (s !== lastSign) { lastSign = s; render(false); }
    }, 500);

    /* ежесекундный пересчёт доступности слотов */
    setInterval(function () { render(false); }, 1000);

    /* перерисовка корзины Tilda */
    try {
      var moT = 0;
      var mo = new MutationObserver(function () {
        if (moT) { return; }
        moT = setTimeout(function () { moT = 0; mountPanels(); schedule(); }, 150);
      });
      mo.observe(document.body, { childList: true, subtree: true });
    } catch (e) {}

    window.addEventListener('storage', function (e) { if (!e.key || e.key.indexOf('tcart') === 0) { schedule(); } });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { lastSync = 0; syncTime(); schedule(); }
    });
  }

  /* Диагностика: выполнить RSB.state() в консоли браузера, если что-то ведёт себя неожиданно */
  window.RSB = {
    cfg: CFG,
    clear: function () { clearCart(); return 'корзина очищается'; },
    state: function () {
      var raw = (window.tcart && window.tcart.products) ? window.tcart.products : null;
      return {
        времяМСК: hhmm(now()), поправкаЧасовСек: Math.round(skew / 1000),
        счётчикTilda: tildaCartCount(),
        позицийВОбъектеTilda: raw ? raw.length : null,
        учтеноПозиций: cartProducts().length,
        разбор: analyze(),
        выбрано: { дата: sel.day, время: sel.time },
        панелей: panels.length,
        товары: cartProducts().map(function (p) {
          return { название: p.name, кол: p.quantity, завтрак: isBreakfast(p), ссылка: p.url };
        }),
        сырыеПозиции: raw
      };
    }
  };

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); }
  else { boot(); }
  window.addEventListener('load', function () { mountPanels(); wrapAdd(); wrapSave(); render(false); });
})();
</script>
